<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- span is an inline element, div is a block level element
    where inline element is used to group inline-elements in a document
    inline only takes up as much width as necessary,
and block level element is used to group block-elements in a document.
block takes all the available width and starts on a new line. -->
    <span>
        <a href="www.google.com">Google</a>
        <a href="www.amazon.com"> Amazon </a>
    </span>
    <div>
         <a href="www.google.com">Google</a>
         <a href="www.amazon.com"> Amazon </a>
    </div>
    <p>
      <h1> a<sup>2</sup> = b<sup>2</sup> + c<sup>2</sup></h1> 
        <br>
        <h1>H<sub>2</sub>O</h1>
        <h3>The sky is cloudy &#9729; &amp; it will rain &#9748; today.</h3>
        <iframe width="704" height="396" src="https://www.youtube.com/embed/iV3lrVsLhsM" title="SUB vs SUP tag in HTML - A Beginner&#39;s Guide | Code Arena" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
       <video src="video.mp4" controls>youtubr</video>
    </p>
</body>
</html>
